<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; display: flex; align-items: stretch; justify-content: flex-start; height: 100vh; margin: 0; }
        #sidebar { width: 250px; background: #2c3e50; color: white; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
        .tab-btn { background: #34495e; color: white; border: none; padding: 10px; margin-bottom: 5px; cursor: pointer; border-radius: 4px; text-align: left; font-size: 14px; }
        .tab-btn.active { background: #3498db; font-weight: bold; }
        .tab-btn:hover:not(.active) { background: #415b76; }
        #new-tab-btn { background: #2ecc71; margin-bottom: 20px; font-weight: bold; text-align: center; }
        #new-tab-btn:hover { background: #27ae60; }
        #chat-container { flex: 1; background: white; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: white; color: #2c3e50; padding: 15px 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #ddd; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 18px; border-radius: 8px; line-height: 1.6; word-wrap: break-word; font-size: 15px; }
        .user-message { background-color: #3498db; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .bot-message { background-color: #ecf0f1; color: #2c3e50; align-self: flex-start; border-bottom-left-radius: 0; }
        .reasoning-btn { background: none; border: none; color: #7f8c8d; cursor: pointer; font-size: 13px; margin-top: 8px; text-decoration: underline; padding: 0; display: block; }
        .reasoning-btn:hover { color: #34495e; }
        .reasoning-content { display: none; background-color: #fdfefe; border: 1px solid #bdc3c7; border-left: 3px solid #f1c40f; padding: 12px; border-radius: 4px; font-size: 13px; margin-top: 8px; white-space: pre-wrap; color: #7f8c8d; }
        #input-container { display: flex; border-top: 1px solid #ddd; padding: 15px; background: #fafafa; }
        #user-input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; transition: border-color 0.3s; }
        #user-input:focus { outline: none; border-color: #3498db; }
        #send-btn { background-color: #2ecc71; color: white; border: none; padding: 12px 24px; margin-left: 10px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background-color 0.3s; }
        #send-btn:hover { background-color: #27ae60; }
        .loading { align-self: flex-start; color: #95a5a6; font-style: italic; display: none; margin-left: 20px; margin-bottom: 15px; }
        
        .markdown-body { font-size: 15px; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 0; margin-bottom: 10px; }
        .markdown-body p { margin-top: 0; margin-bottom: 10px; }
        .markdown-body ul, .markdown-body ol { margin-top: 0; margin-bottom: 10px; padding-left: 20px; }
        .markdown-body li { margin-bottom: 4px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div id="sidebar">
    <button id="new-tab-btn" class="tab-btn" onclick="createNewTab()">+ New Chat</button>
    <div id="tabs-list"></div>
</div>

<div id="chat-container">
    <div class="header" style="display: flex; justify-content: space-between; align-items: center;">
        <span id="chat-title">Nemotron AI Assistant</span>
        <button onclick="clearChat()" style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;">Clear Chat</button>
    </div>
    <div id="chat-box">
    </div>
    <div class="loading" id="loading-indicator">Thinking deeply...</div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Ask me anything..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const loadingIndicator = document.getElementById("loading-indicator");
    
    let currentChatId = 'Chat 1';

    window.onload = async function() {
        await loadChat(currentChatId);
    };
    
    function renderTabs(chatIds) {
        const list = document.getElementById('tabs-list');
        list.innerHTML = '';
        chatIds.forEach(id => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn' + (id === currentChatId ? ' active' : '');
            btn.textContent = id;
            btn.onclick = () => loadChat(id);
            list.appendChild(btn);
        });
    }

    function createNewTab() {
        const list = document.getElementById('tabs-list');
        const num = list.children.length + 1;
        loadChat("Chat " + num);
    }

    async function loadChat(chatId) {
        currentChatId = chatId;
        document.getElementById('chat-title').textContent = "Nemotron AI - " + chatId;
        
        try {
            const response = await fetch(`/chat/history/?chat_id=${encodeURIComponent(chatId)}`, { credentials: "same-origin" });
            const data = await response.json();
            
            if (data.chat_ids) {
                renderTabs(data.chat_ids);
            }
            
            chatBox.innerHTML = '';
            if (data.history && data.history.length > 0) {
                data.history.forEach(msg => {
                    if (msg.role === 'user') {
                        addMessage(msg.content, 'user');
                    } else if (msg.role === 'assistant') {
                        addBotMessage(msg.content, msg.reasoning_details);
                    }
                });
            } else {
                chatBox.innerHTML = '<div class="message bot-message">Hello! I am ready to provide highly detailed and comprehensive answers. What would you like to discuss today?</div>';
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (e) {
            console.error("Failed to load history", e);
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }

    async function clearChat() {
        if (!confirm("Are you sure you want to clear this chat history?")) return;
        try {
            await fetch("/chat/clear/", { 
                method: "POST", 
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: currentChatId }),
                credentials: "same-origin" 
            });
            chatBox.innerHTML = '<div class="message bot-message">Hello! I am ready to provide highly detailed and comprehensive answers. What would you like to discuss today?</div>';
        } catch (e) {
            console.error("Failed to clear chat context", e);
        }
    }

    function toggleReasoning(btn) {
        const content = btn.nextElementSibling;
        if (content.style.display === "none" || !content.style.display) {
            content.style.display = "block";
            btn.textContent = "Hide Reasoning";
        } else {
            content.style.display = "none";
            btn.textContent = "Show Reasoning";
        }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';
        
        loadingIndicator.style.display = 'block';
        chatBox.scrollTop = chatBox.scrollHeight;
        
        const botMsgDiv = addEmptyBotMessage();

        try {
            const response = await fetch("/chat/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify({ message: text, chat_id: currentChatId })
            });
            
            loadingIndicator.style.display = 'none';
            
            if (!response.ok) {
                botMsgDiv.querySelector('.markdown-body').textContent = "Error: Something went wrong";
                return;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let fullText = "";
            let markdownContainer = botMsgDiv.querySelector('.markdown-body');

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');
                
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const dataStr = line.replace('data: ', '').trim();
                        if (dataStr === '[DONE]') break;
                        if (!dataStr) continue;
                        
                        try {
                            const data = JSON.parse(dataStr);
                            if (data.error) {
                                fullText += "\n\nError: " + data.error;
                            }
                            if (data.content) {
                                fullText += data.content;
                            }
                        } catch (e) {
                            console.error("JSON parse error on stream", e);
                        }
                    }
                }
                
                markdownContainer.innerHTML = marked.parse(fullText);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        } catch (error) {
            loadingIndicator.style.display = 'none';
            botMsgDiv.querySelector('.markdown-body').textContent = "Network Error: " + error.message;
        }
    }

    function addEmptyBotMessage() {
        const msgDiv = document.createElement("div");
        msgDiv.className = "message bot-message";
        const textSpan = document.createElement("div");
        textSpan.className = "markdown-body";
        msgDiv.appendChild(textSpan);
        chatBox.appendChild(msgDiv);
        return msgDiv;
    }

    function addMessage(text, sender) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}-message`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    
    function addBotMessage(text, reasoning) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "message bot-message";
        
        const textSpan = document.createElement("div");
        textSpan.className = "markdown-body";
        textSpan.innerHTML = marked.parse(text);
        msgDiv.appendChild(textSpan);
        
        if (reasoning) {
            const btn = document.createElement("button");
            btn.className = "reasoning-btn";
            btn.textContent = "Show Model Reasoning";
            btn.onclick = function() { toggleReasoning(this); };
            
            const reasoningDiv = document.createElement("div");
            reasoningDiv.className = "reasoning-content";
            reasoningDiv.textContent = reasoning;
            
            msgDiv.appendChild(btn);
            msgDiv.appendChild(reasoningDiv);
        }
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
